version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - blender-cache:/tmp/blender
    environment:
      - BLENDER_PATH=/usr/bin/blender
      - DATA_DIR=/app/data
      - MAX_UPLOAD_SIZE=52428800
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  blender-cache:
